name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Typecheck, Test, Build & E2E
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Check
        run: pnpm run format

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit Tests
        run: pnpm run test

      - name: Seed Database
        run: pnpm run seed
        env:
          MONGODB_URI: "mongodb://localhost:27017/ci"
          MONGODB_DB: "devden"
          AUTH_SECRET: "ci_secret_mock_32_characters_minimum_length"

      - name: Production Build
        run: pnpm run build
        env:
          NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
          AUTH_SECRET: "ci_secret_mock_32_characters_minimum_length"
          ADMIN_EMAIL: "admin@example.com"
          ADMIN_PASSWORD_HASH: "$2b$10$ID9Nz3EliuQr3LspBB5Qiu21z/FdV5v0DBvodnp7N2qmyV9U68.5W"
          TEST_ADMIN_PASSWORD: "test-admin-ci-password-1234"
          MONGODB_URI: "mongodb://localhost:27017/ci"
          MONGODB_DB: "devden"

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E Tests
        run: pnpm run test:e2e
        env:
          NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
          AUTH_SECRET: "ci_secret_mock_32_characters_minimum_length"
          ADMIN_EMAIL: "admin@example.com"
          ADMIN_PASSWORD_HASH: "$2b$10$ID9Nz3EliuQr3LspBB5Qiu21z/FdV5v0DBvodnp7N2qmyV9U68.5W"
          TEST_ADMIN_PASSWORD: "test-admin-ci-password-1234"
          MONGODB_URI: "mongodb://localhost:27017/ci"
          MONGODB_DB: "devden"

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
